[pytest]
# Run `pytest` from the repository root. The unit tests live in the package,
# in odmcbf/tests, and import it from the root; nothing needs to be installed.
testpaths = odmcbf/tests
# CLARABEL reports a few steps as optimal_inaccurate; the LMI residuals, which
# the filter recomputes itself (FilterResult.safety_residual), are still at the
# 1e-9 level.
filterwarnings =
    ignore:Solution may be inaccurate:UserWarning
