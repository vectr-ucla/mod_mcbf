# Unit tests of odmcbf (odmcbf/tests), including the checks against the manuscript.
#
#   locked   requirements-lock.txt, the versions the saved results were produced
#            with; also reports line and branch coverage of the package
#   minimum  the oldest versions requirements.txt documents
#   latest   requirements.txt resolved today, on the newest supported Python
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.deps }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: locked
            python: "3.12"
            install: -r requirements-lock.txt
            pytest-args: --cov --cov-report=term
          - deps: minimum
            python: "3.12"
            install: numpy==1.26.4 cvxpy==1.5.2 matplotlib==3.7.3 sympy==1.12 pytest==8.0.0
            pytest-args: ""
          - deps: latest
            python: "3.13"
            install: -r requirements.txt
            pytest-args: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.install }}

      - name: Show versions
        run: |
          python -c "import sys, numpy, scipy, cvxpy, clarabel, matplotlib; print('python', sys.version.split()[0]); print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| cvxpy', cvxpy.__version__, '| clarabel', clarabel.__version__, '| matplotlib', matplotlib.__version__); print('solvers', cvxpy.installed_solvers())"

      - name: Run the unit tests
        run: python -m pytest -rfEX ${{ matrix.pytest-args }}
